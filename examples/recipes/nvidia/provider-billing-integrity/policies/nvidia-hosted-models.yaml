#
# Egress for policy retrieval: Nemotron embed and rerank on build.nvidia.com.
# Two POST paths on two hosts, Python only. Applied by scripts/install.sh.
#
# Credentials never enter the sandbox. The embed call uses the sandbox's
# NVIDIA_INFERENCE_API_KEY placeholder (bound to integrate.api.nvidia.com); the
# rerank call uses NVIDIA_AI_API_KEY, supplied by the provider defined in
# providers/nvidia-ai-api.yaml (bound to ai.api.nvidia.com). OpenShell replaces
# each placeholder at egress and only on its bound host.
#
# The Kumo route (/v1/structured-data/nvidia/kumo-relational/**) is deliberately
# not allowed yet; it arrives with the Kumo stage.

version: 1
preset:
  name: nvidia-hosted-models
network_policies:
  nvidia-hosted-models:
    name: nvidia-hosted-models
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/embeddings
    - host: ai.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/retrieval/nvidia/nemotron-3.5-rerank-8b/reranking
    binaries:
    - path: /usr/bin/python3*
    - path: /usr/local/bin/python3*
