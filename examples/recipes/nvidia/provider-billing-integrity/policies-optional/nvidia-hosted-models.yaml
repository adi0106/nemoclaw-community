# NOT APPLIED BY scripts/install.sh. Draft for the planned Kumo ranking and
# Nemotron embed/rerank policy retrieval stages (not yet in the skill).
# Review the hosts, methods, and paths against live traffic before use.
# Spike result (OpenShell 0.0.116): with this policy applied, a Python call to
# integrate.api.nvidia.com/v1/embeddings succeeds using the sandbox's
# NVIDIA_INFERENCE_API_KEY placeholder; the raw key is never in the sandbox.
# Calls to ai.api.nvidia.com additionally need a credential bound to that host:
# see providers-optional/nvidia-ai-api.yaml.

version: 1
preset:
  name: nvidia-hosted-models
network_policies:
  nvidia-hosted-models:
    name: nvidia-hosted-models
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/embeddings
    - host: ai.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/structured-data/nvidia/kumo-relational/**
      - allow:
          method: POST
          path: /v1/retrieval/nvidia/nemotron-3.5-rerank-8b/reranking
    binaries:
    - path: /usr/bin/python3*
    - path: /usr/local/bin/python3*
