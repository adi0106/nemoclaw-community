#
# OpenShell provider profile that binds a second credential to ai.api.nvidia.com,
# the host for Nemotron rerank (and later Kumo). Imported by scripts/install.sh.
# The default NVIDIA inference credential is bound to integrate.api.nvidia.com
# only, so calls to ai.api.nvidia.com fail with credential_endpoint_mismatch.
# install.sh imports this profile, creates a provider of this type from the
# build.nvidia.com key in .env (as NVIDIA_AI_API_KEY) and attaches it.

id: billing-integrity-nvidia-ai-api
display_name: NVIDIA AI API (rerank)
description: Hosted Nemotron rerank on ai.api.nvidia.com
category: other
credentials:
- name: api_key
  description: build.nvidia.com API key for ai.api.nvidia.com
  env_vars:
  - NVIDIA_AI_API_KEY
  required: true
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: ai.api.nvidia.com
  port: 443
  protocol: rest
  enforcement: enforce
  rules:
  - allow:
      method: POST
      path: /v1/retrieval/nvidia/nemotron-3.5-rerank-8b/reranking
binaries:
- /usr/bin/python3*
- /usr/local/bin/python3*
